# Thông số robot hexapod — đơn vị SI, góc tính bằng độ
body:
  radius: 0.10        # m, tâm thân -> khớp coxa
  mass: 1.2           # kg
  stand_height: 0.10  # m
leg:
  lengths: [0.05, 0.08, 0.12]   # coxa, femur, tibia (m)
  mass: 0.15                    # kg / chân
  home_reach: 0.10              # m, khoảng cách ngang từ khớp femur tới đầu chân khi đứng
  joint_limits_deg:
    coxa:  [-45, 45]
    femur: [-90, 90]
    tibia: [-150, 0]
  mount_angles_deg: [-30, -90, -150, 150, 90, 30]   # RF, RM, RR, LR, LM, LF
actuator:
  kp: 20.0
  kd: 0.5
  torque_max: 1.5     # N·m
gait:
  default: tripod
  swing_height: 0.04  # m
  max_stride: 0.08    # m
sim:
  physics_dt: 0.001
  control_dt: 0.01
  broadcast_hz: 30
  seed: 42
